name: Release one tool

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Validate tool and version
        run: |
          if ($env:RELEASE_TAG -notmatch '^([a-z][a-z0-9]*(?:-[a-z0-9]+)*)/v(\d+\.\d+\.\d+)$') { throw 'Invalid release tag' }
          $id = $Matches[1]
          $version = $Matches[2]
          $tool = ./scripts/Get-Tool.ps1 -Tool $id
          if ($tool.Version -ne $version) { throw 'Tag and project version differ' }
          "TOOL_ID=$id" >> $env:GITHUB_ENV
          "TOOL_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test
        run: ./scripts/test.ps1 -Tool $env:TOOL_ID
      - name: Package
        run: ./scripts/build.ps1 -Tool $env:TOOL_ID
      - name: Create draft release
        run: |
          $id = $env:TOOL_ID
          $version = $env:TOOL_VERSION
          $package = "tools/$id/release/$id-$version-win-x64.zip"
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This release already exists; do not overwrite it' }
          gh release create $env:RELEASE_TAG $package "$package.sha256" "tools/$id/release/$id-update.json" --verify-tag --draft --title "$id v$version" --notes-file "tools/$id/CHANGELOG.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
